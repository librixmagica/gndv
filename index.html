  <body>
    <a-scene>
      <a-gltf-model
      src="trex.glb?v=2"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.5 0.5 0.5"
      animation-mixer="clip: *; loop: repeat"
      gesture-controls="rotationEnabled: true; scaleEnabled: false; translationEnabled: false">

          <a-entity camera
            look-controls="touchEnabled: true"
          position="0 1.6 5"
            look-at="0 0 0">

      <a-sky color=black></a-sky>
