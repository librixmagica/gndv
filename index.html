<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>gondavAR</title>

<!-- A-Frame y A-Frame Extras -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

<!-- AR.js para A-Frame -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  /* Pantalla inicial: fondo negro, solo el boton de play centrado */
  #start-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  #play-button {
    width: 25vw;
    max-width: 120px;
    min-width: 64px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="start-screen">
  <img id="play-button" src="./play.png" alt="Play">
</div>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; matrixCodeType: 3x3;"
  color-space="sRGB"
  renderer="precision: mediump; alpha: true; antialias: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- El ?v=1 al final de cada src es la clave anti-cache -->
    <a-asset-item id="asset-dino1" src="./assets/models/dino1.glb?v=5"></a-asset-item>
    <a-asset-item id="asset-dino2" src="./assets/models/dino2.glb?v=1"></a-asset-item>
    <a-asset-item id="asset-dino3" src="./assets/models/dino3.glb?v=1"></a-asset-item>
    <a-asset-item id="asset-dino4" src="./assets/models/dino4.glb?v=1"></a-asset-item>
    <a-asset-item id="asset-dino5" src="./assets/models/dino5.glb?v=1"></a-asset-item>
  </a-assets>

  <!-- Dino 1 (Barcode 0) -->
  <a-marker type="barcode" value="0">
    <a-gltf-model
      gltf-model="#asset-dino1"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-marker>

  <!-- Dino 2 (Barcode 1) -->
  <a-marker type="barcode" value="1">
    <a-gltf-model
      gltf-model="#asset-dino2"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-marker>

  <!-- Dino 3 (Barcode 2) -->
  <a-marker type="barcode" value="2">
    <a-gltf-model
      gltf-model="#asset-dino3"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-marker>

  <!-- Dino 4 (Barcode 3) -->
  <a-marker type="barcode" value="3">
    <a-gltf-model
      gltf-model="#asset-dino4"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-marker>

  <!-- Dino 5 (Barcode 4) -->
  <a-marker type="barcode" value="4">
    <a-gltf-model
      gltf-model="#asset-dino5"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const startScreen = document.getElementById('start-screen');
    const playButton = document.getElementById('play-button');

    playButton.addEventListener('click', () => {
      startScreen.style.display = 'none';
      history.pushState({ arActive: true }, '', '');
    });

    window.addEventListener('popstate', () => {
      startScreen.style.display = 'flex';
    });
  });
</script>

</body>
</html>
