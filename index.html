<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>gondavAR</title>

<!-- TEMPORAL: consola de debug visible en el celular. Sacar esto despues de encontrar el problema. -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%;  }

  /* Pantalla inicial: fondo negro, solo el boton de play centrado */
  #start-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999; /* por encima del canvas de a-scene */
  }
  #play-button {
    width: 25vw;
    max-width: 120px;
    min-width: 64px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="start-screen">
  <img id="play-button" src="./play.png" alt="">
</div>

<a-scene
    mindar-image="imageTargetSrc: ./assets/targets/targets.mind?v=4; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true, toneMapping: NoToneMapping, exposure: 5"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  
  <a-assets>
    <!-- El ?v=1 al final de cada src es la clave anti-cache: subilo (v=2, v=3...)
         cada vez que reemplaces un .glb para forzar al navegador a descargar
         el archivo nuevo en vez de servir el que tenia guardado. -->
    <a-asset-item id="asset-dino1" src="./assets/models/dino1.glb?v=4"></a-asset-item>
    <a-asset-item id="asset-dino2" src="./assets/models/dino2.glb?v=1"></a-asset-item>
    <a-asset-item id="asset-dino3" src="./assets/models/dino3.glb?v=1"></a-asset-item>
    <a-asset-item id="asset-dino4" src="./assets/models/dino4.glb?v=1"></a-asset-item>
    <a-asset-item id="asset-dino5" src="./assets/models/dino5.glb?v=1"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- targetIndex debe coincidir con el orden en que las imágenes fueron
       subidas al compilador de MindAR (0 = primera imagen) -->

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      gltf-model="#asset-dino1"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model
      gltf-model="#asset-dino2"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model
      gltf-model="#asset-dino3"
      position="0 0 0"
      rotation="90 0 0"
     scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 3">
    <a-gltf-model
      gltf-model="#asset-dino4"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 4">
    <a-gltf-model
      gltf-model="#asset-dino5"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.2 0.2 0.2"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

</a-scene>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const sceneEl = document.querySelector('a-scene');
    const startScreen = document.getElementById('start-screen');
    const playButton = document.getElementById('play-button');
    let arSystem;

    sceneEl.addEventListener('loaded', () => {
      arSystem = sceneEl.systems['mindar-image-system'];
    });

    playButton.addEventListener('click', () => {
      startScreen.style.display = 'none';
      if (arSystem) {
        arSystem.start(); // arranca la camara + tracking
      }
      // Agrega una entrada al historial para poder capturar el boton "atras"
      history.pushState({ arActive: true }, '', '');
    });

    // Boton "atras" del navegador (o gesto equivalente en el celular):
    // apaga la camara y vuelve a mostrar la pantalla de play
    window.addEventListener('popstate', () => {
      if (arSystem) {
        arSystem.stop();
      }
      startScreen.style.display = 'flex';
    });
  });
</script>

</body>
</html>
