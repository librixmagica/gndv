<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>gondavAR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
</style>
</head>
<body>

<a-scene
    mindar-image="imageTargetSrc: ./assets/targets/targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true, toneMapping: NoToneMapping, exposure: 3"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  
  <a-assets>
    <a-asset-item id="asset-dino1" src="./assets/models/dino1.glb"></a-asset-item>
    <a-asset-item id="asset-dino2" src="./assets/models/dino2.glb"></a-asset-item>
    <a-asset-item id="asset-dino3" src="./assets/models/dino3.glb"></a-asset-item>
    <a-asset-item id="asset-dino4" src="./assets/models/dino4.glb"></a-asset-item>
    <a-asset-item id="asset-dino5" src="./assets/models/dino5.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- targetIndex debe coincidir con el orden en que las imágenes fueron
       subidas al compilador de MindAR (0 = primera imagen) -->

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      gltf-model="#asset-dino1"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.15 0.15 0.15"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model
      gltf-model="#asset-dino2"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.15 0.15 0.15"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model
      gltf-model="#asset-dino3"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.15 0.15 0.15"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 3">
    <a-gltf-model
      gltf-model="#asset-dino4"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.15 0.15 0.15"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 4">
    <a-gltf-model
      gltf-model="#asset-dino5"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.15 0.15 0.15"
      animation-mixer="loop: repeat">
    </a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>
